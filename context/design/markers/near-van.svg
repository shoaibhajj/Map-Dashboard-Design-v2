<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 88" width="60" height="88" role="img" aria-label="Van Near Marker 2.5D">
  <defs>
    <linearGradient id="van-body-grad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="var(--marker-body-highlight, #fdfefe)"/>
      <stop offset="35%" stop-color="var(--marker-body-light, #e3eef0)"/>
      <stop offset="75%" stop-color="var(--marker-body-mid, #b6ccd2)"/>
      <stop offset="100%" stop-color="var(--marker-body-dark, #809da4)"/>
    </linearGradient>
    <linearGradient id="van-glass-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--marker-glass-deep, #0b252c)"/>
      <stop offset="50%" stop-color="var(--marker-glass-mid, #133f4a)"/>
      <stop offset="100%" stop-color="var(--marker-glass-base, #071c22)"/>
    </linearGradient>
    <linearGradient id="van-roof-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--marker-roof-top, #cbe0e4)"/>
      <stop offset="100%" stop-color="var(--marker-roof-base, #97b3ba)"/>
    </linearGradient>
    <filter id="van-shadow" x="-35%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="5" stdDeviation="4.2" flood-color="var(--marker-shadow-color, rgba(0,0,0,0.4))"/>
    </filter>
    <filter id="van-beacon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="var(--marker-color, #22c55e)" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
