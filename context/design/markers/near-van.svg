      --marker-body-mid: #b6ccd2;
      --marker-body-dark: #809da4;
      --marker-chassis-side: #526e76;
      --marker-roof-top: #cbe0e4;
      --marker-roof-base: #97b3ba;
      --marker-glass-deep: #0b252c;
