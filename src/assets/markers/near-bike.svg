<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" role="img" aria-label="Two-Wheeler Bike Near Marker 2.5D">
  <defs>
    <!-- Tank / Chassis Gradient -->
    <linearGradient id="bike-body-grad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="var(--marker-body-highlight, #ffffff)"/>
      <stop offset="50%" stop-color="var(--marker-body-light, #eaf3f5)"/>
      <stop offset="100%" stop-color="var(--marker-body-mid, #adc4cb)"/>
    </linearGradient>

    <!-- 2.5D Drop Shadow -->
    <filter id="bike-shadow" x="-35%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="1.5" dy="4" stdDeviation="3.2" flood-color="var(--marker-shadow-color, rgba(0,0,0,0.4))"/>
    </filter>
    <filter id="bike-beacon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="var(--marker-color, #22c55e)" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    :root, svg {
      --marker-color: #22c55e;
      --marker-color-light: #5eedc5;
      --marker-body-highlight: #ffffff;
      --marker-body-light: #eaf3f5;
      --marker-body-mid: #adc4cb;
      --marker-rider-head: #ffffff;
      --marker-rider-shoulders: #29464e;
      --marker-wheel-rim: #7e9ea5;
      --marker-shadow-color: rgba(0, 0, 0, 0.4);
    }
    .dark svg, svg.dark, :root.dark svg {
      --marker-body-highlight: #dce7ea;
      --marker-body-light: #adc2c8;
      --marker-body-mid: #6f8d95;
      --marker-rider-head: #d5e5e8;
      --marker-rider-shoulders: #1b2f35;
      --marker-wheel-rim: #536c72;
      --marker-shadow-color: rgba(0, 0, 0, 0.65);
    }
  </style>

  <!-- 2.5D Ground Shadow (Slim) -->
  <ellipse cx="25" cy="37" rx="8" ry="26" fill="var(--marker-shadow-color, rgba(0,0,0,0.4))" filter="url(#bike-shadow)"/>

  <!-- Front Wheel with Brake Disc -->
  <rect x="22" y="8" width="4" height="14" rx="2" fill="#131e21" stroke="var(--marker-wheel-rim, #7e9ea5)" stroke-width="0.8"/>

  <!-- Front Suspension Fork (Theme Tinted) -->
  <path d="M21 16 L23 22 M27 16 L25 22" stroke="var(--marker-color, #22c55e)" stroke-width="1.5"/>

  <!-- Front LED Headlight Beam -->
  <path d="M21 8 L27 8 L25 13 L23 13 Z" fill="var(--marker-color-light, #5eedc5)"/>

  <!-- Handlebars with Handgrips & Mirrors -->
  <path d="M13 21 L20 23 L28 23 L35 21" stroke="#e0f4f7" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="13" cy="21" r="1.5" fill="var(--marker-color, #22c55e)"/>
  <circle cx="35" cy="21" r="1.5" fill="var(--marker-color, #22c55e)"/>

  <!-- Compact Digital HUD Display -->
  <rect x="22" y="21" width="4" height="3" rx="0.5" fill="#0c262e" stroke="var(--marker-color, #22c55e)" stroke-width="0.8"/>

  <!-- Sculpted Fuel Tank / Battery Chassis -->
  <path d="M20 25 Q24 23 28 25 L29 34 Q24 35 19 34 Z" fill="url(#bike-body-grad)" stroke="#dff3f6" stroke-width="1"/>

  <!-- 2.5D Rider Silhouette (Helmet & Shoulders) -->
  <ellipse cx="24" cy="37" rx="4.5" ry="5.5" fill="var(--marker-rider-head, #ffffff)" stroke="#719ba3" stroke-width="1"/>
  <path d="M22 34 Q24 33 26 34" stroke="#0e2a33" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 38 Q24 40 32 38" stroke="var(--marker-rider-shoulders, #29464e)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Seat & Rear Subframe -->
  <path d="M21 44 H27 L26 50 H22 Z" fill="#1b2e35"/>

  <!-- Rear Wheel -->
  <rect x="22" y="48" width="4" height="14" rx="2" fill="#131e21" stroke="var(--marker-wheel-rim, #7e9ea5)" stroke-width="0.8"/>

  <!-- Rear Taillight & Telemetry Beacon -->
  <rect x="22.5" y="47" width="3" height="2" fill="#ff4d6d"/>
  <circle cx="24" cy="45" r="1.4" fill="var(--marker-color, #22c55e)" filter="url(#bike-beacon-glow)"/>
</svg>
