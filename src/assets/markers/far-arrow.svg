<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vehicle Far Heading Marker">
  <defs>
    <!-- Dynamic theme gradients using CSS variables with fallback to vibrant green/mint -->
    <linearGradient id="arrow-facet-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--marker-color-dark, #168056)"/>
      <stop offset="100%" stop-color="var(--marker-color-deep, #0f5c3d)"/>
    </linearGradient>
    <linearGradient id="arrow-facet-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--marker-color-light, #5eedc5)"/>
      <stop offset="100%" stop-color="var(--marker-color, #22c55e)"/>
    </linearGradient>

    <!-- 2.5D Drop Shadow -->
    <filter id="arrow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="var(--marker-shadow-color, rgba(0,0,0,0.4))"/>
    </filter>
    <filter id="arrow-beacon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="var(--marker-color, #22c55e)" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    :root, svg {
      --marker-color: #22c55e;
      --marker-color-light: #5eedc5;
      --marker-color-dark: #168056;
      --marker-color-deep: #0f5c3d;
      --marker-core-bg: #072027;
      --marker-shadow-color: rgba(0, 0, 0, 0.4);
    }
    .dark svg, svg.dark, :root.dark svg {
      --marker-core-bg: #041418;
      --marker-shadow-color: rgba(0, 0, 0, 0.65);
    }
  </style>

  <!-- 2.5D Ground Shadow -->
  <path d="M32 12 L50 50 L32 41 L14 50 Z" fill="var(--marker-shadow-color, rgba(0,0,0,0.4))" filter="url(#arrow-shadow)"/>

  <!-- Left Facet (Beveled Shaded 2.5D) -->
  <path d="M32 10 L14 48 L32 39 Z" fill="url(#arrow-facet-left)" stroke="var(--marker-color, #22c55e)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Right Facet (Beveled Luminous 2.5D) -->
  <path d="M32 10 L50 48 L32 39 Z" fill="url(#arrow-facet-right)" stroke="var(--marker-color-light, #5eedc5)" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Center Ridge Reflection Spine -->
  <line x1="32" y1="12" x2="32" y2="38" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

  <!-- Central IoT Heading Beacon -->
  <circle cx="32" cy="27" r="3.2" fill="var(--marker-core-bg, #072027)" stroke="var(--marker-color-light, #5eedc5)" stroke-width="1"/>
  <circle cx="32" cy="27" r="1.6" fill="var(--marker-color, #22c55e)" filter="url(#arrow-beacon-glow)"/>
</svg>
